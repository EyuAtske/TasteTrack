services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tastetrack-backend
    ports:
      - "5000:5000"
    # ADD THIS ENVIRONMENT BLOCK:
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://admin:password@tastetrack-mongo:27017/tastetrack?authSource=admin
      - JWT_SECRET=HilcoeProjectSecretKey
      - PUBLIC_URL=http://localhost:5000
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@tastetrack.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      mongo:
        condition: service_healthy
    command: sh -c "npm run seed:all; npm run dev"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tastetrack-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - VITE_PROXY_TARGET=http://backend:5000

  mongo:
    image: mongo:8
    container_name: tastetrack-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mongo-data:
  uploads: